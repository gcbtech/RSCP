name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # CI runs in UTC; tests that need the store's zone pin America/Denver themselves.
        run: python -m pytest -q -p no:cacheprovider tests/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: bash -n install.sh
        run: bash -n install.sh

      - name: shellcheck install.sh
        run: |
          shellcheck --version
          # warning and above fail the build; info-level notes (e.g. the
          # deliberate `[ a ] && [ b ] || die` guards, SC2015) are style hints
          # whose set differs between shellcheck versions.
          shellcheck --severity=warning install.sh

      - name: Byte-compile app/
        run: python -m compileall -q app
